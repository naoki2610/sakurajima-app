name: Auto Update Weather and Volcano Data

on:
  schedule:
    # 1時間ごとに全自動実行する設定（※時間は協定世界時）
    - cron: '0 * * * *'
  workflow_dispatch: # 手動で強制実行するためのボタンも有効化

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: リポジトリの読み込み
        uses: actions/checkout@v4

      - name: Node.jsの準備
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 必要なプログラム部品のインストール
        run: npm install xml2js

      - name: 最新の気象・降灰データの取得実行
        run: node scripts/fetch-ashfall.cjs

      - name: 取得した新データを自動保存（上書き）
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add public/data/dashboard_data.json
          git commit -m "Auto-update: 最新の気象・降灰データに更新" || exit 0
          git push
